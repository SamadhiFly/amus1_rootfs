# Log rotate configuration file
# 
######################################################################

# always rotate daily
daily
# keep only one rotation file
rotate 0
# Copy contents and truncate the file
copytruncate
# No error if log file not exist
missingok
# No compression
nocompress
# Do not rotate if file is empty
notifempty
# rotate if the file is larger than 5MB
maxsize 5000000

"/home/bird/data/logs/*.log" {
  postrotate
    # Get the log file name
    name=$(basename ${1} .log)
    # Get the path of the log file
    dir=$(dirname $1)
    # Time stamp uses for contructing the file name of the backup  
    date_str=$(date -r ${1}.1 +%Y%m%d%H%M%S)
    # Move the rotated file to in /home/bird/data/logs/backup with
    # timestamp on rotation as part of the name of the backup file  
    mv ${1}.1 ${dir}/backup/${name}-${date_str}.log
  endscript
}

